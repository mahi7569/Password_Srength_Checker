<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Checker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url("my1.jpg");
            background-repeat: no-repeat;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            width: 320px;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        .strength {
            font-weight: bold;
            margin-top: 10px;
            padding: 8px;
            border-radius: 6px;
        }
        .weak { color: red; }
        .medium { color: orange; }
        .strong { color: green; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔒Password Strength Checker</h2>
        <input type="password" id="password" placeholder="Enter your password">
        <div id="strengthOutput" class="strength"></div>
    </div>

    <script>
        const password = document.getElementById('password');
        const strengthOutput = document.getElementById('strengthOutput');

        password.addEventListener('input', function() {
            const val = password.value;
            let score = 0;

            if (val.length >= 8) score++;
            if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score++;
            if (/[0-9]/.test(val)) score++;
            if (/[@$!%*#?&]/.test(val)) score++;
            
            if (score <= 1) {
                strengthOutput.textContent = "Weak Password";
                strengthOutput.className = "strength weak";
            } else if (score == 2 || score == 3) {
                strengthOutput.textContent = "Medium Password";
                strengthOutput.className = "strength medium";
            } else {
                strengthOutput.textContent = "Strong Password";
                strengthOutput.className = "strength strong";
            }
        });
    </script>
</body>
</html>
